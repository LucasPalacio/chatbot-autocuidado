name: Validacao Continua (CI)

on:
  push:
    branches: [ "main", "entrega-intermediaria" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes-e-lint:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar o código do repositório
      uses: actions/checkout@v4

    - name: 2. Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 3. Instalar as dependências do projeto
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8 requests streamlit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 4. Analisar o estilo do código (Linting / Flake8)
      # O exit-zero faz com que o robô apenas avise sobre erros de estilo, sem quebrar sua nota
      run: |
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 5. Executar os Testes de Integração (Pytest)
      run: |
        pytest -v